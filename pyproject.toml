[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "syphon-python"
version = "0.2.0"
description = "Python wrapper for the GPU texture sharing framework Syphon."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "vendor/Syphon/License.txt"]
authors = [{ name = "Florian Bruggisser", email = "github@broox.ch" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "pyobjc-core~=12.2.2",
    "pyobjc-framework-Metal~=12.2.2",
    "pyobjc-framework-Cocoa~=12.2.2",
]

[project.urls]
Homepage = "https://github.com/cansik/syphon-python"
Documentation = "https://cansik.github.io/syphon-python/"
Repository = "https://github.com/cansik/syphon-python"
Issues = "https://github.com/cansik/syphon-python/issues"

[project.optional-dependencies]
opengl = ["PyOpenGL>=3.1.10,<4"]
numpy = ["numpy>=2,<3"]

[dependency-groups]
dev = ["ruff>=0.12", { include-group = "test" }]
test = ["pytest>=8", "packaging>=25", "hatchling>=1.27,<2"]
docs = ["pdoc>=16,<17"]
examples = ["numpy>=2,<3", "opencv-python>=4.12,<5", "glfw>=2.9,<3"]

[tool.uv]
environments = ["sys_platform == 'darwin'"]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "vendor/Syphon/**/*.pbxproj" },
    { file = "vendor/Syphon/*.h" },
    { file = "vendor/Syphon/*.m" },
    { file = "vendor/Syphon/*.c" },
    { file = "vendor/Syphon/*.metal" },
]

[tool.hatch.build.targets.wheel]
packages = ["syphon"]
exclude = ["syphon/libs/*.framework/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "/syphon", "/vendor/Syphon", "/hatch_build.py", "/tests",
    "/scripts", "/doc", "/examples", "/pyproject.toml",
    "/README.md", "/DOCUMENTATION.md", "/LICENSE",
]
exclude = [
    "/vendor/Syphon/.git", "/vendor/Syphon/build", "/syphon/libs/*.framework",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["metal: native integration tests requiring a Metal device"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["vendor"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
