name: Publish release

on:
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish to PyPI (requires the pypi trusted publisher)
        type: boolean
        default: false
      publish_release:
        description: Create a GitHub release and upload distributions
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the default branch for publishing
        if: inputs.publish_pypi || inputs.publish_release
        env:
          SELECTED_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$SELECTED_REF" = "refs/heads/$DEFAULT_BRANCH"

  validate:
    needs: guard
    uses: ./.github/workflows/build.yml

  pypi:
    if: inputs.publish_pypi
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/syphon-python/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist
      - name: Publish tested distributions using OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release:
    if: inputs.publish_release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist
      - name: Create versioned release with tested distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          existing_tag=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v$RELEASE_VERSION" \
            --jq ".[] | select(.ref == \"refs/tags/v$RELEASE_VERSION\") | .ref")
          test -z "$existing_tag" || { echo "Release tag already exists: $existing_tag"; exit 1; }
          gh release create "v$RELEASE_VERSION" dist/*.whl dist/*.tar.gz \
            --target "$RELEASE_COMMIT" --title "Version $RELEASE_VERSION" --generate-notes
