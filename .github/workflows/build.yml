name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Test all supported Python versions
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        description: Test all supported Python versions
        type: boolean
        default: false
    outputs:
      version:
        description: Package version from pyproject.toml
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.29'
      - name: Ensure the Xcode Metal compiler is available
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Install development dependencies
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: uv sync --locked --group docs --extra numpy --extra opengl
      - name: Check formatting and lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Build source archive and universal wheel from it
        run: uv build
      - name: Validate distributions
        run: uv run --no-sync pytest tests/test_distributions.py --dist-dir dist
      - name: Build documentation
        run: uv run --no-sync python scripts/generate_doc.py
      - name: Read package version
        id: metadata
        run: |
          .venv/bin/python -c 'import tomllib; print("version=" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  test:
    if: ${{ !inputs.full }}
    needs: build
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        python: ['3.10', '3.14', '3.14t']
        exclude:
          - os: macos-15-intel
            python: '3.10'
          - os: macos-15-intel
            python: '3.14t'
    steps: &test-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.29'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist
      - name: Ensure the Xcode Metal compiler is available for source builds
        if: inputs.full && matrix.os == 'macos-15' && matrix.python == '3.14'
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Test installed wheel with and without extras
        env:
          TEST_PYTHON: ${{ steps.python.outputs.python-path }}
          TEST_VARIANT: ${{ endsWith(matrix.python, 't') && 'free-threaded' || 'standard' }}
          TEST_PYTHON_VERSION: ${{ matrix.python }}
          TEST_NATIVE: ${{ (matrix.python == '3.14' || (matrix.os == 'macos-15' && matrix.python == '3.14t')) && 'true' || 'false' }}
          TEST_SOURCE: ${{ inputs.full && matrix.os == 'macos-15' && matrix.python == '3.14' && 'true' || 'false' }}
        run: bash scripts/ci_test.sh

  test-full:
    if: ${{ inputs.full }}
    needs: build
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.13t', '3.14t']
        exclude:
          - os: macos-15-intel
            python: '3.11'
          - os: macos-15-intel
            python: '3.12'
          - os: macos-15-intel
            python: '3.13'
          - os: macos-15-intel
            python: '3.13t'
    steps: *test-steps
